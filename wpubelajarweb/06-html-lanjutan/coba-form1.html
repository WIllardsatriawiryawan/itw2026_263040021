<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Element Form</title>
  </head>
  <body>
    <h1>Contoh element element form pada HTML</h1>

    <form>
      <label for="nama"
        >Nama:
        <input
          type="text"
          name="nama"
          id="nama"
          placeholder="Masukkan Nama Anda"
        />
      </label>
      <br />
      <label for="password"
        >Password:
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Masukkan Password Anda"
        />
      </label>
      <br />
      <label for="email"
        >Email:
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Masukkan Email Anda"
        />
      </label>
      <br />
      <label for="Angka"
        >Angka:
        <input
          type="number"
          name="angka"
          id="angka"
          min="0"
          max="100"
          placeholder="Masukkan Angka"
        />
      </label>
      <br />
      <label for="tanggal"
        >Tanggal:
        <input
          type="date"
          name="tanggal"
          id="tanggal"
          placeholder="Masukkan Tanggal"
        />
      </label>
      <br />
      <label for="warna"
        >Warna:
        <input
          type="color"
          name="warna"
          id="warna"
          placeholder="Masukkan Warna"
        />
      </label>
      <br />
      <button type="submit">Kirim!</button>
    </form>
  </body>
</html>
