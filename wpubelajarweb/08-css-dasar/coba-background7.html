<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }

      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid #fff;
        margin: auto;
        background-image:
          url(img/Paul.Partohap.Transparent.png), url(img/Blob.png),
          url(img/Api.dan.Asap.Transparan.png);
        background-size: 600px, 350px, 700px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position:
          center bottom,
          center 70%,
          bottom center;
        background-color: #f0f0f0;
        border-radius: 50%;
      }

      h1 {
        color: #fff;
        text-align: center;
        font-family: "Courier New", courier, monospace;
        font-size: 40px;
        text-shadow: 2px 2px 4px black;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
